    slide: 
      header1: 'Grinding malt'
      text1: 'Grinding malt is one of the most important operations in the initial stage of beer production. This is because in order to break down the substances present in the malt, it is necessary for the enzymes to reach them. This is most easily and practically done by grinding malt. In this way, the already small particles of malt are much easier to break down into sugars, amino acids and other substances. Pre-purified and weighed malt is ground in special malt mills.'
      header2: 'Mixing malt with water'
      text2: 'Water provides an opportunity for the action of enzymes, as well as conditions for some substances to pass into a soluble form. '
      header3: 'Mashing'
      text3: 'Mashing is one of the most important, but perhaps one of the most complex processes in beer production. The process itself is the maintenance of certain temperatures of malt slurry for a certain time. ' 
      header4: 'Filtration of malt slurry'
      text4: 'The purpose of this stage is to separate the liquid from the malt bran. The liquid is a combination of water and extracts obtained by mashing and is called wort. '
      header5: 'Washing the malt bran and brewing'
      text5: 'Washing the malt bran and brewing the wort with hops, which gives the beer its specific bitterness and aroma. Its addition to wort is carried out precisely at the high temperature of brewing, because there the hop bitter substances are most completely dissolved, utilized and transformed.'
      header6: 'Separation of hot sludge'
      text6: 'Hot sludge is formed during cooking and is the most undesirable, then their removal is carried out immediately after brewing the wort. ' 
      header7: 'Cooling and aeration of the wort'
      text7: Cooling is associated with the subsequent fermentation of the wort with a pure culture of brewer's yeast. If this cooling does not take place, the high temperature would destroy the microorganisms. Aeration of the wort provides oxygen, which promotes the intensive reproduction of the yeast, as a result of which it is ensured that the fermentation will take place in a desired and controlled way.
      header8: 'Fermentation of wort'
      text8: The use of pure culture of brewer's yeast is one of the greatest advantages of modern brewing. This largely ensures the high quality of the beer. This can only be done using a carefully selected and controlled strain of brewer's yeast
      header9: 'Main alcoholic fermentation '
      text9: Alcoholic fermentation is the natural and only way to turn wort into beer. It is carried out by brewer's yeast. One of the most important substances is the sugars obtained during mashing. In the course of fermentation, they are converted into alcohol and carbon dioxide, which gave the beer a drink with a completely natural alcohol content and soda.
      header10: 'Fermentation and maturation of beer'
      text10: 'Allows for additional formation of alcohol and saturation of beer with carbon dioxide. In addition, a number of other changes are made in the composition of the beer, which shape its aromatic and taste characteristics.'
      header11: 'Filtration of beer'
      text11: 'Beer contains many tiny particles that disrupt its clarity. Usually, they are completely natural, and largely useful. To remove these particles, the beer is subjected to a final filtration, after which it acquires the crystalline form that we know and consume. '
      header12: 'Calming the beer'
      text12: 'After filtration, the carbon dioxide in the beer is mainly in two forms - bound and free. An equilibrium is established between these two forms, and when the beer is subjected to various external influences, this balance is disturbed. Therefore, immediately after filtration, the beer is fed for soothing in special devices.'
      header13: 'Beer bottling'
      text13:  'pasteurization is one of the main treatments of beer, which aims only to increase its durability and stability. Depending on the chosen packaging and technological solution, pasteurization can be carried out before or after pouring the beer.'

