    slide: 
      header1: 'Смилане на малца'
      text1: 'Смилането на малца е една от най-важните операции в началния етап на производството на пиво. Това е така понеже, за да се осъществи разграждането на веществата, налични в малца е необходимо ензимите да достигнат до тях. Това най-лесно и практично се осъществява чрез смилането на малца. По този начин малките вече частички малц много по-лесно се разграждат до захари, аминокиселини и други вещества. Предварително пречистения и претеглен малц се смила в специални малцови мелници.'
      header2: 'Смесване на малца с вода'
      text2: 'Водата осигурява възможност за действие на ензимите, както и условия някои вещества да преминат в разтворима форма'
      header3: 'Майшуване'
      text3: 'Майшуването е един от най-важните, но може би и един от най-сложните процеси при производството на пиво. Самият процес представлява поддържането на определени температури на малцовата каша за определено време. ' 
      header4: 'Филтрация и промиване'
      text4: 'Филтрация на малцовата каша - Целта на този етап е да се отдели течността от малцовите трици. Течността представлява комбинация от вода и екстрактни вещества, получени при майшуването и се нарича пивна мъст. '
      header5: 'Варене на пивовата смес с хмел'
      text5: 'Промиване на малцовите трици и Варене на пивната мъст с хмел, който придава специфичната горчивина и аромат на пивото. Прибавянето му към пивната мъст се извършва именно при високата температура на варене, понеже там най-пълно се разтварят, оползотворяват и трансформират хмеловите горчиви вещества.'
      header6: 'Отделяне на горещи утайки'
      text6: 'Горещите утайки се формират още при варенето и са най-нежелани, то тяхното отстраняване се извършва непосредствено след варенето на пивната мъст.' 
      header7: 'Охлаждане'
      text7: 'Охлаждане и аериране на пивната мъст - охлаждането е свързано с последващото заквасване на пивната мъст с чиста култура пивни дрожди. Ако не се осъществи това охлаждане, високата температура би унищожила микроорганизмите. Аериране на пивната мъст доставя кислород, който спомага за интензивното размножаване на дрождите, вследствие на което се гарантира че ферментацията ще се проведе по желан и контролиран начин. '
      header8: 'Аериране и заквасване'
      text8: 'Заквасване на пивната мъст - Използването на чиста култура пивни дрожди е едно от най-големите предимства на съвременното пивопроизводството. Това гарантира до голяма степен високото качество на пивото. Това може да се осъществи единствено с използване на внимателно подбран и контролиран щам пивни дрожди'
      header9: 'Основна ферментация'
      text9: 'Главна алкохолна ферментация - Алкохолната ферментация е естествения и единствен начин за превръщането на пивната мъст в пиво. Тя се осъществява от пивните дрожди. Едни от най-важните вещества са захарите, получени при майшуването. В хода на ферментацията те се превръщат в алкохол и въглероден диоксид, което приви пивото напитка с напълно естествено алкохолно съдържание и газировка.'
      header10: 'Допълнителна ферментация'
      text10: 'Доферментиране и съзряване на пивото - дава възможност за допълнително образуване на алкохол и насищане на пивото с въглероден диоксид. Освен това се извършват и редица други промени в състава на пивото, които оформят неговата ароматно-вкусова характеристика. '
      header11: 'Филтриране'
      text11: 'Пивото съдържа множество миниатюрни частици, които нарушават неговата бистрота. Обикновено, те са напълно естествени, и в голяма степен полезни. За отстраняването на тези частици, пивото подлежи на една окончателна филтрация, след което то добива онзи кристален вид, който познаваме и консумираме.'
      header12: 'Успокояване на пивото'
      text12: 'След филтрацията, въглеродния диоксид в пивото се намира основно в две форми – свързан и свободен. Между тези две форми се установява равновесие, а когато пивото бъде подложено на различни външни въздействия, това равновесие се нарушава. Ето защо непосредствено след филтрацията пивото се подава за успокояване в специални апарати. '
      header13: 'Пакитиране'
      text13:  'Бутилиране на пивото - пастьоризацията е една от основните обработки на пивото, която цели единствено повишаване на неговата трайност и стабилност. В зависимост от избраната опаковка и технологично решение, пастьоризацията може да се проведе преди или след разливане на пивото. '