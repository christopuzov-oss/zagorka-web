bg:
  date:
    formats:
      default: "%d.%m.%Y"
      short: "%d %b"
      long: "%d %B %Y"
      custom: "%A, %d %B, %Y"

    day_names:
      - неделя
      - понеделник
      - вторник
      - сряда
      - четвъртък
      - петък
      - събота
    abbr_day_names:
      - нед
      - пон
      - вт
      - ср
      - чет
      - пет
      - съб

    # should start with nil cause there is no 0-th month
    month_names:
      - ~
      - януари
      - февруари
      - март
      - април
      - май
      - юни
      - юли
      - август
      - септември
      - октомври
      - ноември
      - декември
    abbr_month_names:
      - ~
      - яну.
      - фев.
      - март
      - апр.
      - май
      - юни
      - юли
      - авг.
      - сеп.
      - окт.
      - ноем.
      - дек.
    order:
      - :day
      - :week
      - :month
      - :year

  time:
    formats:
      default: "%H:%M:%S"
      short: "%H:%M"
      long: "%d %B %Y, %H:%M"
    am: "преди обяд"
    pm: "следобед"

  support:
    array:
      words_connector: ", "
      two_words_connector: " и "
      last_word_connector: " и "

    select:
      prompt: "Моля отбележете"

  number:
    format:
      separator: ","
      delimiter: " "
      precision: 3
      significant: false
      strip_insignificant_zeros: false

    currency:
      format:
        format: "%n %u"
        unit: "лв."
        separator: ","
        delimiter: " "
        precision: 2
        significant: false
        strip_insignificant_zeros: false

    percentage:
      format:
        delimiter: ""

    precision:
      format:
        delimiter: ""

    human:
      format:
        delimiter: ""
        precision: 1
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        # Storage units output formatting.
        # %u is the storage unit, %n is the number (default: 2 MB)
        format: "%n %u"
        units:
          byte:
            one:   "Байт"
            other: "Байта"
          kb: "КБ"
          mb: "МБ"
          gb: "ГБ"
          tb: "ТБ"
      decimal_units:
        format: "%n %u"
        units:
          unit: ""
          thousand: хиляди
          million: милиона
          billion: милиарда
          trillion: трилиона
          quadrillion: квадрилиона

  datetime:
    distance_in_words:
      half_a_minute: "половин минута"
      less_than_x_seconds:
        one:   "по-малко от 1 секунда"
        other: "по-малко от %{count} секунди"
      x_seconds:
        one:   "1 секунда"
        other: "%{count} секунди"
      less_than_x_minutes:
        one:   "по-малко от 1 минута"
        other: "по-малко от %{count} минути"
      x_minutes:
        one:   "1 минута"
        other: "%{count} минути"
      about_x_hours:
        one:   "около 1 час"
        other: "около %{count} часа"
      x_days:
        one:   "1 ден"
        other: "%{count} дни"
      about_x_months:
        one:   "около 1 месец"
        other: "около %{count} месеца"
      x_months:
        one:   "1 месец"
        other: "%{count} месеца"
      about_x_years:
        one:   "около 1 година"
        other: "около %{count} години"
      over_x_years:
        one:   "над 1 година"
        other: "над %{count} години"
      almost_x_years:
        one:   "почти 1 година"
        other: "почти %{count} години"
    prompts:
      year:   "Година"
      month:  "Месец"
      week:   "Седмица"
      day:    "Ден"
      hour:   "Час"
      minute: "Минута"
      second: "Секунда"

  helpers:
